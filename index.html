<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLoad Home</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            display: flex; 
            flex-direction: column;
            justify-content: space-between; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }

        /* Sayfa içeriğini merkezlemek için ana kapsayıcı */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            width: 100%;
            padding: 20px 0;
        }

        /* Kart Giriş Animasyonu */
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 90%; 
            max-width: 500px; 
            text-align: center;
            animation: fadeIn 0.6s ease-in-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            margin: 15px 0; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #28a745;
            box-shadow: 0 0 8px rgba(40, 167, 69, 0.3);
        }

        button { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button:hover { 
            background-color: #218838; 
        }

        button:active {
            transform: scale(0.98);
        }

        #result { 
            margin-top: 20px; 
            text-align: left; 
        }

        .result-content {
            animation: slideUp 0.5s ease-out;
        }

        img { 
            max-width: 100%; 
            border-radius: 8px; 
            margin-bottom: 10px; 
        }

        .dl-btn { 
            display: inline-block; 
            background-color: #007bff; 
            color: white; 
            padding: 10px 18px; 
            text-decoration: none; 
            border-radius: 4px; 
            margin-top: 10px; 
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .dl-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        /* Yükleniyor Spineri Animasyonu */
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #28a745;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        /* Alt Bilgi (Footer) Stilleri */
        footer {
            width: 100%;
            background-color: #ffffff;
            border-top: 1px solid #e7e7e7;
            padding: 15px 0;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        footer a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: #0056b3;
            text-decoration: underline;
        }

        /* Keyframe Animasyonları */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="card">
        <h2>COLoad Video Downloader</h2>
        <p>İndirmek istediğiniz video bağlantısını buraya yapıştırın:</p>
        <input type="text" id="videoUrl" placeholder="Not⚠️: Video linki için platformdaki 'Paylaş' butonuna basın...">
        <button onclick="downloadVideo()">Videoyu Getir</button>

        <div id="result"></div>
    </div>
</div>

<footer>
    <p>&copy; 2026 <strong>COLoad</strong>. Tüm Hakları Saklıdır. | Geliştirici: <a href="https://coteam.gt.tc" target="_blank">COTeam</a></p>
</footer>

<script>
    
    const API_URL = "https://coload.coteam.gt.tc/api/download";

    async function downloadVideo() {
        const url = document.getElementById('videoUrl').value;
        const resultDiv = document.getElementById('result');
        
        if (!url) {
            alert('Lütfen bir video linki girin!');
            return;
        }

        resultDiv.innerHTML = `
            <div style="text-align: center;">
                <div class="spinner"></div>
                <p>Video hazırlanıyor, bu biraz uzun sürebilir...</p>
            </div>
        `;

        try {
            const response = await fetch(`${API_URL}?url=${encodeURIComponent(url)}`);
            const data = await response.json();

            if (data.success) {
                resultDiv.innerHTML = `
                    <div class="result-content">
                        <h3>${data.title}</h3>
                        <img src="${data.thumbnail}" alt="Thumbnail">
                        <p><strong>Yayınlayan:</strong> ${data.uploader || 'Bilinmiyor'}</p>
                        <a href="${data.download_link}" target="_blank" class="dl-btn" download>Videoyu İndir</a>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `<p style="color:red;">Hata: Video alınamadı.</p>`;
            }
        } catch (error) {
            resultDiv.innerHTML = `<p style="color:red;">API sunucusuna bağlanılamadı! Geliştirici ile iletişime geçin...</p>`;
        }
    }
</script>

</body>
</html>
