<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLoad - Ücretsiz Video İndirici</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        input[type="text"] { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; }
        button:hover { background-color: #218838; }
        #result { margin-top: 20px; text-align: left; }
        img { max-width: 100%; border-radius: 8px; margin-bottom: 10px; }
        .dl-btn { display: inline-block; background-color: #007bff; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>COLoad Video Downloader</h2>
    <p>Video bağlantısını aşağıya yapıştırın:</p>
    <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
    <button onclick="downloadVideo()">Videoyu Getir</button>

    <div id="result"></div>
</div>

<script>
    // RENDER ÜZERİNDEKİ KENDİ API ADRESİNİZİ BURAYA YAZIN
    const API_URL = "https://coload.onrender.com/api/download";

    async function downloadVideo() {
        const url = document.getElementById('videoUrl').value;
        const resultDiv = document.getElementById('result');
        
        if (!url) {
            alert('Lütfen bir video linki girin!');
            return;
        }

        resultDiv.innerHTML = "<p>Video bilgileri getiriliyor, lütfen bekleyin...</p>";

        try {
            const response = await fetch(`${API_URL}?url=${encodeURIComponent(url)}`);
            const data = await response.json();

            if (data.success) {
                resultDiv.innerHTML = `
                    <h3>${data.title}</h3>
                    <img src="${data.thumbnail}" alt="Thumbnail">
                    <p><strong>Yayınlayan:</strong> ${data.uploader || 'Bilinmiyor'}</p>
                    <a href="${data.download_link}" target="_blank" class="dl-btn" download>Videoyu İndir</a>
                `;
            } else {
                resultDiv.innerHTML = `<p style="color:red;">Hata: Video alınamadı.</p>`;
            }
        } catch (error) {
            resultDiv.innerHTML = `<p style="color:red;">API sunucusuna bağlanılamadı!</p>`;
        }
    }
</script>

</body>
</html>
